[project]
name = "cvnator"
version = "0.1.0"
description = "Autonomous AI Job Application Agent - local-first, goal-driven browser agent"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "playwright>=1.49",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.10",
    "keyring>=25.5",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-reportlab",
]

[project.scripts]
cvnator = "cvnator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvnator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008: FastAPI's Depends()/Form() defaults are the documented idiom.
# E501: long lines are caught by the formatter, not the linter.
# UP042: `str, Enum` is deliberate - it keeps values stable across pydantic,
#        SQLAlchemy and JSON without depending on StrEnum semantics.
# B027:  LLMProvider's load/unload/loaded_models are optional capabilities with
#        no-op defaults, not abstract methods every provider must implement.
ignore = ["B008", "E501", "UP042", "B027"]

[tool.mypy]
python_version = "3.12"
packages = ["cvnator"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
